<main class="bg relative grid min-h-dvh place-items-center px-4 py-10">
  <!-- Put your art at public/images/login-bg.jpg; inline url() resolves against <base href>. -->
  <div
    class="absolute inset-0 bg-cover bg-center opacity-60"
    style="background-image: url(images/login-bg.jpg)"
    aria-hidden="true"
  ></div>
  <section
    class="relative w-full max-w-sm rounded-3xl border border-line/80 bg-panel/85 p-6 shadow-2xl backdrop-blur-md"
  >
    <h1 class="text-center font-display text-3xl font-bold tracking-wide text-white">
      <span class="text-hope">Dagger</span><span class="text-fear">heart</span>
    </h1>
    <p class="mt-1 text-center text-sm text-muted">Mesa Nix</p>

    @switch (step()) {
      @case ('pick') {
        <form class="mt-6 flex flex-col gap-3" [formGroup]="pickForm" (ngSubmit)="submitPick()">
          <label for="pick" class="label">Quem é você?</label>
          <select id="pick" class="field" formControlName="pick" [attr.aria-busy]="loading()">
            <option value="" disabled>
              {{ loading() ? 'Carregando personagens…' : 'Escolha seu personagem' }}
            </option>
            @if (characterList().length) {
              <optgroup label="Personagens">
                @for (c of characterList(); track c.id) {
                  <option [value]="'char:' + c.id">{{ c.name }}</option>
                }
              </optgroup>
            }
            @if (draftList().length) {
              <optgroup label="Em criação">
                @for (d of draftList(); track d.id) {
                  <option [value]="'draft:' + d.id">{{ d.name }} (continuar guia)</option>
                }
              </optgroup>
            }
            <optgroup label="Mesa">
              <option [value]="gmOption">Mestre</option>
            </optgroup>
          </select>
          <button type="submit" class="btn-hope mt-1" [disabled]="busy() || pick.invalid">
            {{ busy() ? 'Entrando…' : 'Entrar' }}
          </button>
          <button
            type="button"
            class="btn bg-white text-ink hover:bg-white/90"
            (click)="goTo('create')"
          >
            Criar novo personagem
          </button>
        </form>
      }
      @case ('pin') {
        <form class="mt-6 flex flex-col gap-3" [formGroup]="pinForm" (ngSubmit)="submitPin()">
          <label for="pin" class="label">PIN do mestre</label>
          <input
            id="pin"
            class="field text-center text-2xl tracking-[0.5em]"
            type="password"
            inputmode="numeric"
            autocomplete="off"
            maxlength="8"
            formControlName="pin"
          />
          <button type="submit" class="btn-fear mt-1" [disabled]="busy() || pin.invalid">
            Entrar como mestre
          </button>
          <button type="button" class="btn-ghost" (click)="goTo('pick')">Voltar</button>
        </form>
      }
      @case ('create') {
        <form class="mt-6 flex flex-col gap-3" [formGroup]="createForm" (ngSubmit)="startGuide()">
          <label for="name" class="label">Nome do novo personagem</label>
          <input
            id="name"
            class="field"
            formControlName="name"
            placeholder="Ex.: Lyra"
            autocomplete="off"
            autocapitalize="words"
            enterkeyhint="go"
          />
          <button type="submit" class="btn-hope mt-1" [disabled]="busy() || name.invalid">
            Guia de criação
          </button>
          <button
            type="button"
            class="btn-ghost"
            [disabled]="busy() || name.invalid"
            (click)="createBlank()"
          >
            Ficha em branco
          </button>
          <button type="button" class="btn text-muted" (click)="goTo('pick')">Voltar</button>
        </form>
      }
    }

    @if (error()) {
      <p class="mt-4 rounded-lg bg-hp/15 px-3 py-2 text-center text-sm text-hp" role="alert">
        {{ error() }}
      </p>
    }
  </section>
  <footer class="absolute inset-x-0 bottom-0 px-4 pb-3">
    <app-license-notice />
  </footer>
</main>
